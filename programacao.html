<meta name="description" content="Baterias, horários, plataformas, atletas, provas e premiações do 7º Campeonato Brasileiro de Kettlebell Sport, Recife, 20 a 22 de novembro de 2026.">

/* v3 (18/11): linguagem do site principal — cartaz esportivo: azul da marca, faixa amarela com base verde,
   sombras sólidas deslocadas, recortes inclinados, títulos Barlow Condensed. Leitura das tabelas em papel claro. */
:root{
  --navy:#021b63; --blue:#043b9c; --blue-bright:#0875d1; --green:#07883f; --yellow:#ffd500;
  --paper:#f7f7f0; --ink:#041747; --ink-2:#2b3f6b; --muted:#d0def5;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --z-sticky:10; --z-modal:100;
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--blue);color:#fff;font:16px/1.5 var(--body);overflow-x:hidden}
a{color:inherit}
.top{position:sticky;top:0;z-index:var(--z-sticky);background:linear-gradient(180deg,rgba(1,22,77,.97),rgba(1,22,77,.9));color:#fff;padding:10px clamp(14px,4vw,48px);display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--yellow)}
.top a.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:900 1rem var(--display);letter-spacing:.08em;text-transform:uppercase;background:var(--yellow);color:var(--ink);padding:8px 16px 8px 12px;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);box-shadow:4px 4px 0 var(--green)}
.top a.back:hover,.top a.back:focus-visible{background:#fff;outline:none}
.top a.back{white-space:nowrap}
@media (max-width:420px){.top a.back .lg{display:none}}
.top strong{font:900 clamp(1.1rem,3.2vw,1.5rem)/1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin-left:auto}
.hero{position:relative;overflow:hidden;background:var(--yellow);color:var(--ink);padding:26px clamp(14px,4vw,48px) 40px;box-shadow:inset 0 -10px 0 var(--green)}
.hero:before{content:"20—22";white-space:nowrap;position:absolute;right:-.04em;top:-.2em;color:rgba(4,23,71,.07);font:900 min(34vw,340px)/.9 var(--display);pointer-events:none}
.hero-in{position:relative;max-width:1080px;margin:0 auto}
.hero p.tag{display:inline-block;margin:0 0 10px;padding:5px 10px;background:var(--ink);color:#fff;font:800 .72rem var(--body);letter-spacing:.12em;text-transform:uppercase}
h1{font:900 clamp(2.6rem,8vw,4.8rem)/.86 var(--display);text-transform:uppercase;margin:0;letter-spacing:-.01em;text-wrap:balance}
.hero .lead{color:var(--ink-2);max-width:62ch;margin:0;font-weight:500}
.wrap{max-width:1080px;margin:0 auto;padding:26px clamp(14px,4vw,48px) 70px}
.dias{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 18px}
.dia{appearance:none;border:3px solid #fff;background:var(--navy);color:#fff;padding:12px 8px;cursor:pointer;font:inherit;text-align:center;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:transform .18s cubic-bezier(.22,1,.36,1),background-color .2s ease}
.dia:hover{transform:translateY(-2px);background:var(--blue-bright)}
.dia:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.dia b{display:block;font:900 1.8rem/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.dia span{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-top:3px}
.dia[aria-selected=true]{background:var(--yellow);color:var(--ink);border-color:var(--yellow)} .dia[aria-selected=true] span{color:var(--ink-2)}
.dia .hoje{display:inline-block;margin-top:5px;font:800 .7rem var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--green);color:#fff;padding:2px 8px}
.dia .falta{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:6px;font:800 .85rem var(--body);font-variant-numeric:tabular-nums;color:var(--yellow)}
.dia[aria-selected=true] .falta{color:var(--ink)}
.dia .falta svg{width:14px;height:14px;flex:none}
.busca{display:flex;gap:8px;margin:0 0 10px} .busca[hidden]{display:none}
.busca input{flex:1;min-width:0;padding:13px 14px;font:16px var(--body);border:3px solid #fff;border-radius:0;background:var(--paper);color:var(--ink)}
.busca input::placeholder{color:#55658a}
.busca input:focus{outline:none;border-color:var(--yellow);box-shadow:5px 5px 0 var(--green)}
.info{color:#fff;font-size:.95rem;margin:0 0 16px;font-weight:600}
.lista{display:flex;flex-direction:column;gap:22px}
.bat{background:var(--paper);color:var(--ink);border:3px solid #fff;box-shadow:10px 10px 0 var(--green)}
.bat header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--navy);color:#fff;border-bottom:3px solid var(--yellow)}
.bat header time{font:900 2rem/1 var(--display);color:var(--yellow);font-variant-numeric:tabular-nums}
.bat header h2{margin:0;font:900 1.5rem/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.bat header small{color:var(--muted);font-size:.85rem;margin-left:auto;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;vertical-align:middle;border-bottom:1px solid rgba(4,23,71,.14)}
th{font:800 .74rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:#ecebe1}
td.pl{width:64px;text-align:center}
td.pl span{display:inline-flex;width:36px;height:36px;align-items:center;justify-content:center;background:var(--yellow);color:var(--ink);font:900 1.35rem var(--display);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
td.nm{font-weight:800;color:var(--ink);font-size:1.04rem}
td.pv{color:var(--ink);font-weight:500} td.ct{color:var(--ink-2);font-weight:600}
tr:last-child td{border-bottom:0}
tr.achou td{background:#fff1a6}
.prem{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--green);color:#fff;border:3px solid #fff;box-shadow:10px 10px 0 var(--yellow)}
.prem time{font:900 2rem/1 var(--display);font-variant-numeric:tabular-nums;color:var(--yellow)}.prem b{font:900 1.45rem/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em}
.prem svg{width:30px;height:30px;flex:none;color:var(--yellow)}
.vazio{padding:18px;background:var(--paper);color:var(--ink);border:3px dashed #fff}
.trava{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:36px 18px;background:var(--navy);border:3px solid #fff;box-shadow:12px 12px 0 var(--green)}
.trava:before{content:"6H";position:absolute;left:-.04em;bottom:-.25em;color:rgba(8,117,209,.35);font:900 min(40vw,260px)/.9 var(--display);pointer-events:none}
.trava > *{position:relative}
.trava svg{width:46px;height:46px;color:var(--yellow)}
.trava h2{margin:0;font:900 1.8rem/1 var(--display);text-transform:uppercase;color:#fff}
.trava p{margin:0;color:var(--muted);max-width:46ch}
.trava .relogio{font:900 clamp(2.6rem,9vw,4.4rem)/1 var(--display);color:var(--yellow);font-variant-numeric:tabular-nums;letter-spacing:.02em;margin:6px 0}
.rodape{margin-top:30px;color:var(--muted);font-size:.85rem}
/* PIN (mesmo visual e animação da página principal) */
.kbp{position:fixed;inset:0;z-index:var(--z-modal);display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(2,10,30,.5);animation:kbp-fade .25s ease both}
.kbp[hidden]{display:none}
.kbp__input{width:min(260px,80vw);height:64px;padding:0 16px;border:0;border-radius:12px;background:rgba(255,255,255,.92);color:#021b63;text-align:center;font:700 2rem/1 Inter,Arial,sans-serif;letter-spacing:.5em;text-indent:.5em;box-shadow:0 10px 40px rgba(0,0,0,.45);outline:0;transition:background-color .2s ease}
.kbp__input::placeholder{color:#8f9bb8;letter-spacing:.4em}
.kbp__card{width:100%;max-width:380px;padding:22px 20px;border-radius:14px;background:#fff;color:#021b63;text-align:center;box-shadow:0 14px 50px rgba(0,0,0,.55);animation:kbp-pop .28s cubic-bezier(.22,1,.36,1) both}
.kbp__card h2{margin:0 0 10px;font:800 1.35rem/1.1 Inter,Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em}
.kbp__card p{margin:0 0 10px} .kbp__close{width:100%;padding:12px;border:2px solid #cfd6e6;border-radius:10px;background:transparent;color:#021b63;font:700 .95rem Inter,Arial,sans-serif;cursor:pointer}
@keyframes kbp-fade{from{opacity:0}to{opacity:1}}
@keyframes kbp-pop{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:640px){
  thead{display:none} table,tbody,tr,td{display:block;width:100%}
  tr{display:grid;grid-template-columns:50px 1fr;column-gap:10px;padding:10px 14px;border-bottom:1px solid rgba(4,23,71,.14)}
  .bat,.prem{box-shadow:6px 6px 0 var(--green)} .prem{box-shadow:6px 6px 0 var(--yellow)} .dias{gap:8px}
  tr:last-child{border-bottom:0} td{border:0;padding:0}
  td.pl{grid-row:1/span 3;width:auto} td.nm{font-size:1.05rem}
  td.pv{font-size:.95rem} td.ct{font-size:.88rem}
  .bat header small{margin-left:0;width:100%}
  .dia b{font-size:1.4rem} .dia .falta{font-size:.74rem;padding:3px 5px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
