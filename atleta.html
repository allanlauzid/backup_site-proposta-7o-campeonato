<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#011d4d">
<title>Área do atleta · 7º CONBRAKS</title>
<style>
  :root{--navy:#011d4d;--navy2:#0b2d6b;--navy3:#163d82;--yellow:#ffcc00;--white:#fff;--muted:#b9c6e0;--err:#ff8a8a;--ok:#5fd88f;--warn:#ffd24d;--card:#0a2557;--bd:#24488f}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--navy);color:var(--white);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  a{color:var(--yellow)}
  .wrap{max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 40px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
  .marca{font:800 .8rem/1.2 system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .marca b{display:block;color:var(--yellow);font-size:1.05rem;letter-spacing:.06em}
  h1{font:800 1.7rem/1.15 system-ui;margin:0 0 6px;text-transform:uppercase;letter-spacing:.02em}
  h2{font:800 1.15rem/1.25 system-ui;margin:22px 0 8px;color:var(--yellow);text-transform:uppercase;letter-spacing:.04em}
  p{margin:0 0 12px} .sub{color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-top:14px}
  label.f{display:block;font-size:.88rem;color:var(--muted);margin:12px 0 4px}
  input.in{width:100%;background:#03153a;color:#fff;border:1px solid #33589e;border-radius:10px;padding:12px;font:16px system-ui}
  input.in:focus,button:focus-visible,a:focus-visible,.opt input:focus-visible+span{outline:3px solid var(--yellow);outline-offset:2px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media (max-width:380px){.row2{grid-template-columns:1fr}}
  .btn{appearance:none;border:0;border-radius:12px;padding:13px 18px;font:800 1rem system-ui;cursor:pointer;background:var(--yellow);color:#111;text-transform:uppercase;letter-spacing:.04em;width:100%;margin-top:16px}
  .btn.sec{background:transparent;color:#fff;border:1px solid #4a6cad}
  .btn:disabled{opacity:.5;cursor:default}
  .link{background:none;border:0;color:var(--yellow);font:600 .95rem system-ui;cursor:pointer;padding:6px 0;text-decoration:underline}
  .msg{margin-top:12px;font-size:.95rem} .msg.err{color:var(--err)} .msg.ok{color:var(--ok)} .msg.warn{color:var(--warn)}
  .cand{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:#03153a;color:#fff;border:1px solid #33589e;border-radius:12px;padding:14px;margin-top:8px;font:inherit;cursor:pointer}
  .cand:hover{border-color:var(--yellow)}
  fieldset.q{border:1px solid var(--bd);border-radius:14px;padding:12px 12px 6px;margin:14px 0 0}
  fieldset.q legend{font-weight:800;padding:0 6px}
  .opt{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;margin-bottom:6px;background:#03153a;border:1px solid transparent;overflow-wrap:anywhere}
  .opt:hover{border-color:#4a6cad} .opt input{width:20px;height:20px;flex:none;accent-color:var(--yellow)}
  .opt.none{background:transparent;border:1px dashed #4a6cad;color:var(--muted)}
  .chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:.98rem} .chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--yellow)}
  .zap{display:inline-flex;align-items:center;gap:8px;background:#1f8f4e;color:#fff;text-decoration:none;font-weight:800;border-radius:12px;padding:12px 16px;margin-top:10px}
  .tbl{width:100%;border-collapse:collapse;font-size:.92rem} .tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd)} .tbl td.n{text-align:right}
  .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px 14px}
  .kv div span{display:block;color:var(--muted);font-size:.78rem}
  .tag{display:inline-block;background:#03153a;border:1px solid #33589e;border-radius:8px;padding:2px 8px;margin:2px 4px 2px 0;font-size:.85rem}
  .sess{display:flex;justify-content:space-between;gap:10px;width:100%;background:#03153a;border:1px solid #33589e;color:#fff;border-radius:12px;padding:12px;margin-top:8px;cursor:pointer;font:inherit;text-align:left}
  .hint{font-size:.82rem;color:var(--muted);margin-top:4px}
  .pw{position:relative} .pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font:600 .8rem system-ui;cursor:pointer;padding:6px}
  footer{margin-top:28px;font-size:.85rem;color:var(--muted);text-align:center}
  .rel{background:#141414;border-radius:14px;padding:12px;margin-top:10px}
  .kb-mock{outline:2px dashed #ff8c00!important;outline-offset:2px}.kb-mock-tag{display:inline-block;font:700 .62rem/1 system-ui,sans-serif;letter-spacing:.06em;color:#ff8c00;border:1px dashed #ff8c00;border-radius:5px;padding:2px 5px;margin-left:6px;vertical-align:2px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="marca">7º Campeonato Brasileiro<b>Kettlebell Sport</b></div>
    <button class="link" id="sair" hidden>Sair</button>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer>Dúvidas? Fale com Jeff no <a href="https://wa.me/5581996484250" target="_blank" rel="noopener">WhatsApp (81) 99648-4250</a>.<br>Seus dados ficam protegidos e só você vê seus resultados.</footer>
</div>
<script src="metricas.js"></script>
<script src="relatorio-fc.js"></script>
<script>
(function () {
  'use strict';
  // Banco (mesmo projeto do contador). A chave é a pública (anon); tudo passa por funções que conferem os dados no servidor.
  let API = { url: 'https://grwoatyylzbfsufzkeyx.supabase.co', key: 'sb_publishable_dwm3sVuoNIohAptwHD_bjg_vM21YtHC' };
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) { const q = new URLSearchParams(location.search).get('api'); if (q) API = { url: q, key: 'teste' }; }   // só em testes locais
  const ZAP = 'https://wa.me/5581996484250', ZAP_TXT = '(81) 99648-4250';
  const K_SESSAO = 'kb_atleta_sessao_v1';
  const app = document.getElementById('app');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (id) => document.getElementById(id);
  const ss = { get: () => { try { return localStorage.getItem(K_SESSAO); } catch (e) { return null; } }, set: (v) => { try { v ? localStorage.setItem(K_SESSAO, v) : localStorage.removeItem(K_SESSAO); } catch (e) {} } };
  async function rpc(fn, corpo) {
    const r = await fetch(API.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: API.key, 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.message || 'Erro ' + r.status);
    return j;
  }
  const zap = (txt) => '<a class="zap" href="' + ZAP + '" target="_blank" rel="noopener">' + esc(txt || 'Falar com Jeff no WhatsApp') + ' · ' + ZAP_TXT + '</a>';
  function tela(h) { app.innerHTML = h; window.scrollTo(0, 0); const f = app.querySelector('[autofocus]'); if (f) f.focus(); }
  function ocupado(btn, sim, txt) { btn.disabled = sim; if (txt) btn.textContent = txt; }
  function falhaRede(el) { el.className = 'msg err'; el.textContent = 'Não foi possível falar com o servidor. Confira a internet e tente de novo.'; }
  function olho() { app.querySelectorAll('.pw button').forEach((b) => { b.onclick = () => { const i = b.previousElementSibling; i.type = i.type === 'password' ? 'text' : 'password'; b.textContent = i.type === 'password' ? 'mostrar' : 'ocultar'; }; }); }

  // ---------- entrar ----------
  function inicio(aviso) {
    $('sair').hidden = true;
    tela('<h1>Área do atleta</h1><p class="sub">Veja seus resultados no contador e, se você usou o sensor cardíaco, a sua frequência cardíaca em cada prova.</p>' +
      '<form class="card" id="fl" novalidate><label class="f" for="u">Nickname ou e-mail</label><input class="in" id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>' +
      '<label class="f" for="p">Senha</label><div class="pw"><input class="in" id="p" type="password" autocomplete="current-password" required><button type="button">mostrar</button></div>' +
      '<button class="btn" id="be">Entrar</button><div class="msg" id="m" role="alert">' + (aviso ? esc(aviso) : '') + '</div>' +
      '<p style="margin:12px 0 0;text-align:center"><button type="button" class="link" id="esq">Esqueci a senha</button></p></form>' +
      '<div class="card"><h2 style="margin-top:0">Primeiro acesso?</h2><p class="sub">Todos os inscritos já estão no sistema. Para criar seu acesso, confirme alguns dados da sua inscrição.</p><button class="btn sec" id="cad">Criar meu acesso</button></div>');
    olho();
    $('esq').onclick = () => busca(true);
    $('cad').onclick = () => busca(false);
    $('fl').onsubmit = async (e) => {
      e.preventDefault(); const m = $('m'), b = $('be');
      const u = $('u').value.trim(), p = $('p').value;
      if (!u || !p) { m.className = 'msg err'; m.textContent = 'Preencha o nickname (ou e-mail) e a senha.'; return; }
      ocupado(b, true, 'Entrando…');
      try {
        const j = await rpc('login', { usuario: u, senha: p });
        if (j.ok) { ss.set(j.sessao); return painel(); }
        m.className = 'msg err';
        m.innerHTML = j.erro === 'bloqueado' ? 'Muitas tentativas com senha errada. Espere 15 minutos ou use "Esqueci a senha".' : 'Nickname, e-mail ou senha não conferem.';
      } catch (x) { falhaRede(m); }
      ocupado(b, false, 'Entrar');
    };
  }

  // ---------- cadastro / recuperação ----------
  let fluxo = { recuperar: false, nome: '', sobrenome: '', atleta: null, token: null, nomeCompleto: '' };
  function busca(recuperar) {
    fluxo = { recuperar, nome: '', sobrenome: '', atleta: null, token: null, nomeCompleto: '' };
    tela('<h1>' + (recuperar ? 'Recuperar acesso' : 'Criar meu acesso') + '</h1><p class="sub">' + (recuperar ? 'Para criar uma senha nova, confirme os dados da sua inscrição.' : 'Passo 1 de 3: encontre a sua inscrição.') + '</p>' +
      '<form class="card" id="fb" novalidate><div class="row2"><div><label class="f" for="n">Primeiro nome</label><input class="in" id="n" autocomplete="given-name" required autofocus></div>' +
      '<div><label class="f" for="s">Sobrenome</label><input class="in" id="s" autocomplete="family-name" required></div></div>' +
      '<p class="hint">Use o primeiro nome e um dos sobrenomes, como na inscrição.</p><button class="btn" id="bb">Procurar minha inscrição</button><div class="msg" id="m" role="alert"></div></form>' +
      '<p style="text-align:center"><button class="link" id="v">Voltar</button></p>');
    $('v').onclick = () => inicio();
    $('fb').onsubmit = async (e) => {
      e.preventDefault(); const m = $('m'), b = $('bb');
      const n = $('n').value.trim(), s = $('s').value.trim();
      if (n.length < 2 || s.length < 2) { m.className = 'msg err'; m.textContent = 'Preencha o primeiro nome e o sobrenome.'; return; }
      ocupado(b, true, 'Procurando…');
      try {
        const lista = await rpc('quiz_buscar', { nome: n, sobrenome: s });
        fluxo.nome = n; fluxo.sobrenome = s;
        if (!lista.length) {
          m.className = 'msg warn'; m.innerHTML = 'Não encontramos uma inscrição com esse nome. Confira a grafia ou tente outro sobrenome. Se não der certo, fale com a organização.<br>' + zap();
          ocupado(b, false, 'Procurar minha inscrição'); return;
        }
        candidatos(lista);
      } catch (x) { falhaRede(m); ocupado(b, false, 'Procurar minha inscrição'); }
    };
  }
  function candidatos(lista) {
    const nome = esc(fluxo.nome + ' ' + fluxo.sobrenome);
    tela('<h1>É você?</h1><p class="sub">' + (lista.length > 1 ? 'Encontramos mais de uma inscrição com esse nome. Escolha a sua pela cidade.' : 'Encontramos esta inscrição.') + '</p>' +
      '<div class="card">' + lista.map((c, i) => '<button class="cand" data-i="' + i + '"><span><strong>' + nome + '</strong><br><span class="sub">' + esc([c.cidade, c.uf].filter(Boolean).join(' / ') || 'cidade não informada') + '</span></span><span aria-hidden="true">›</span></button>').join('') +
      '<p class="hint" style="margin-top:12px">Não é você? <button class="link" id="v">Procurar de novo</button></p></div>');
    $('v').onclick = () => busca(fluxo.recuperar);
    app.querySelectorAll('.cand').forEach((b) => { b.onclick = () => quiz(lista[+b.dataset.i]); });
  }
  const PERG = { equipe: 'Qual é a sua equipe?', nascimento: 'Qual é a sua data de nascimento?', telefone: 'Qual é o seu WhatsApp?', email: 'Qual é o seu e-mail?' };
  async function quiz(c) {
    fluxo.atleta = c;
    tela('<h1>Confirme seus dados</h1><p class="sub">Carregando…</p>');
    let j; try { j = await rpc('quiz_iniciar', { atleta_id: c.id }); } catch (x) { tela('<h1>Confirme seus dados</h1><div class="msg err">Não foi possível falar com o servidor. Confira a internet e tente de novo.</div><button class="btn sec" id="v">Voltar</button>'); $('v').onclick = () => busca(fluxo.recuperar); return; }
    if (!j.ok) {
      const txt = j.erro === 'menor' ? '<p>Para atletas menores de idade, o acesso é liberado pela organização junto com o responsável.</p>' + zap('Pedir liberação ao Jeff')
        : j.erro === 'bloqueado' ? '<p>Você já usou as 5 tentativas de hoje. Tente amanhã ou fale com a organização.</p>' + zap()
        : '<p>Não foi possível abrir o questionário.</p>' + zap();
      tela('<h1>Confirme seus dados</h1><div class="card">' + txt + '</div><p style="text-align:center"><button class="link" id="v">Voltar ao início</button></p>');
      $('v').onclick = () => inicio(); return;
    }
    tela('<h1>Confirme seus dados</h1><p class="sub">' + (fluxo.recuperar ? '' : 'Passo 2 de 3. ') + 'Marque a opção certa em cada pergunta. Parte dos dados aparece escondida com *. Se nenhuma for a sua, marque "Nenhuma das alternativas".</p>' +
      '<form class="card" id="fq" novalidate>' + j.perguntas.map((p, i) => '<fieldset class="q"><legend>' + (i + 1) + '. ' + esc(PERG[p.tipo] || p.tipo) + '</legend>' +
        p.alternativas.map((a, k) => '<label class="opt' + (k === 5 ? ' none' : '') + '"><input type="radio" name="q' + i + '" value="' + k + '"><span>' + esc(a) + '</span></label>').join('') + '</fieldset>').join('') +
      '<p class="hint" style="margin-top:12px">Tentativas restantes hoje: <strong id="tr">' + j.tentativas_restantes + '</strong> de 5.</p>' +
      '<button class="btn" id="bq">Conferir</button><div class="msg" id="m" role="alert"></div></form>' +
      '<p style="text-align:center"><button class="link" id="v">Voltar</button></p>');
    $('v').onclick = () => busca(fluxo.recuperar);
    $('fq').onsubmit = async (e) => {
      e.preventDefault(); const m = $('m'), b = $('bq');
      const resp = j.perguntas.map((p, i) => { const r = app.querySelector('input[name="q' + i + '"]:checked'); return r ? +r.value : null; });
      if (resp.some((r) => r === null)) { m.className = 'msg err'; m.textContent = 'Responda as 4 perguntas.'; return; }
      ocupado(b, true, 'Conferindo…');
      try {
        const r = await rpc('quiz_concluir', { atleta_id: c.id, respostas: resp });
        if (r.ok) { fluxo.token = r.token; fluxo.nomeCompleto = r.nome; fluxo.sugestao = r.nickname_sugerido; fluxo.existe = r.conta_existente; return confirma(); }
        if (r.erro === 'bloqueado') { tela('<h1>Confirme seus dados</h1><div class="card"><p>Alguma resposta não confere e você usou as 5 tentativas de hoje.</p><p>Tente de novo amanhã ou fale com a organização.</p>' + zap() + '</div><p style="text-align:center"><button class="link" id="v">Voltar ao início</button></p>'); $('v').onclick = () => inicio(); return; }
        m.className = 'msg err'; m.innerHTML = 'Alguma resposta não confere. Você ainda tem <strong>' + r.tentativas_restantes + '</strong> tentativa(s) hoje.';
        $('tr').textContent = r.tentativas_restantes;
      } catch (x) { falhaRede(m); }
      ocupado(b, false, 'Conferir');
    };
  }
  function confirma() {
    tela('<h1>Confirmação</h1><div class="card"><p>Encontramos a inscrição de <strong>' + esc(fluxo.nomeCompleto) + '</strong>.</p>' +
      '<label class="chk"><input type="checkbox" id="ck"><span>Confirmo que sou <strong>' + esc(fluxo.nomeCompleto) + '</strong> e que os dados conferidos são meus.</span></label>' +
      '<button class="btn" id="bc" disabled>Continuar</button></div>');
    $('ck').onchange = (e) => { $('bc').disabled = !e.target.checked; };
    $('bc').onclick = conta;
  }
  function conta() {
    const tit = fluxo.existe ? 'Nova senha' : 'Crie seu acesso';
    tela('<h1>' + tit + '</h1><p class="sub">' + (fluxo.recuperar || fluxo.existe ? '' : 'Passo 3 de 3. ') + 'Você vai entrar com o nickname (ou com o seu e-mail cadastrado) e a senha.</p>' +
      '<form class="card" id="fc" novalidate><label class="f" for="nk">Nickname</label><input class="in" id="nk" value="' + esc(fluxo.sugestao || '') + '" autocapitalize="none" spellcheck="false" autocomplete="username" required>' +
      '<p class="hint">Sugestão automática; pode mudar. Use de 3 a 30 letras minúsculas, números, ponto ou _ (sem espaço e sem acento).</p>' +
      '<label class="f" for="s1">Senha nova</label><div class="pw"><input class="in" id="s1" type="password" autocomplete="new-password" required minlength="6"><button type="button">mostrar</button></div><p class="hint">Mínimo de 6 caracteres.</p>' +
      '<label class="f" for="s2">Repita a senha</label><div class="pw"><input class="in" id="s2" type="password" autocomplete="new-password" required><button type="button">mostrar</button></div>' +
      '<button class="btn" id="bs">Salvar</button><div class="msg" id="m" role="alert"></div></form>');
    olho();
    $('nk').addEventListener('input', (e) => { const v = e.target.value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9._]/g, ''); if (v !== e.target.value) e.target.value = v; });
    $('fc').onsubmit = async (e) => {
      e.preventDefault(); const m = $('m'), b = $('bs');
      const nk = $('nk').value.trim(), s1 = $('s1').value, s2 = $('s2').value;
      m.className = 'msg err';
      if (!/^[a-z0-9._]{3,30}$/.test(nk)) { m.textContent = 'Nickname inválido: use de 3 a 30 letras minúsculas, números, ponto ou _.'; return; }
      if (s1.length < 6) { m.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
      if (s1 !== s2) { m.textContent = 'As duas senhas não são iguais.'; return; }
      ocupado(b, true, 'Salvando…');
      try {
        const r = await rpc('conta_definir', { token: fluxo.token, nickname: nk, senha: s1 });
        if (r.ok) return sucesso(r.nickname, s1);
        m.textContent = r.erro === 'nickname_em_uso' ? 'Esse nickname já é de outra pessoa. Escolha outro.' : r.erro === 'token' ? 'O tempo para concluir acabou (20 minutos). Faça a confirmação de novo.' : 'Não foi possível salvar. Tente de novo.';
      } catch (x) { falhaRede(m); }
      ocupado(b, false, 'Salvar');
    };
  }
  function sucesso(nk, senha) {
    tela('<h1>Pronto!</h1><div class="card"><p class="msg ok" style="margin-top:0;font-weight:700">' + (fluxo.existe ? 'Sua senha foi trocada.' : 'Seu acesso foi criado.') + '</p>' +
      '<p>Entre com o nickname <strong>' + esc(nk) + '</strong> ou com o seu e-mail cadastrado, e a senha que você acabou de criar.</p>' +
      '<p class="sub">Se esquecer a senha, é só fazer o cadastro de novo pelo link "Esqueci a senha" (as mesmas perguntas). Dúvidas: fale com o Jeff.</p>' + zap() +
      '<button class="btn" id="be">Ver meus resultados</button></div>');
    $('be').onclick = async () => {
      try { const j = await rpc('login', { usuario: nk, senha }); if (j.ok) { ss.set(j.sessao); return painel(); } } catch (x) {}
      inicio('Entre com o seu nickname e a senha.');
    };
  }

  // ---------- painel ----------
  let mostrarC = false;
  async function painel() {
    const s = ss.get(); if (!s) return inicio();
    tela('<h1>Meus resultados</h1><p class="sub">Carregando…</p>');
    let d; try { d = await rpc('atleta_meus_dados', { sessao: s }); } catch (x) { tela('<h1>Meus resultados</h1><div class="msg err">Não foi possível falar com o servidor. Confira a internet.</div><button class="btn sec" id="t">Tentar de novo</button>'); $('t').onclick = painel; return; }
    if (!d.ok) { ss.set(null); return inicio('Sua sessão expirou. Entre de novo.'); }
    $('sair').hidden = false;
    $('sair').onclick = async () => { try { await rpc('atleta_sair', { sessao: s }); } catch (x) {} ss.set(null); inicio(); };
    const kv = [['Equipe', d.equipe], ['Cidade', [d.cidade, d.uf].filter(Boolean).join(' / ')], ['Idade no evento', d.idade], ['Classe de peso (10 min)', d.classe_10], ['Classe de peso (12/30 min)', d.classe_12_30],
      ['Peso na pesagem', d.pesagem && d.pesagem.peso_kg != null ? String(d.pesagem.peso_kg).replace('.', ',') + ' kg' : null], ['FC de repouso', d.pesagem && d.pesagem.fc_repouso != null ? d.pesagem.fc_repouso + ' bpm' : null]].filter((x) => x[1] != null && x[1] !== '');
    const dur = (x) => x == null ? '–' : Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0');
    tela('<h1' + (d.mock ? ' class="kb-mock"' : '') + '>' + esc(d.apelido || d.nome) + (d.mock ? '<span class="kb-mock-tag" title="Dado fictício (mock)">MOCK</span>' : '') + '</h1><p class="sub">Conectado como <strong>' + esc(d.nickname) + '</strong></p>' +
      '<div class="card"><h2 style="margin-top:0">Minha inscrição</h2><div class="kv">' + kv.map((x) => '<div><span>' + esc(x[0]) + '</span>' + esc(x[1]) + '</div>').join('') + '</div>' +
      ((d.inscricoes || []).length ? '<p style="margin:12px 0 0">' + d.inscricoes.map((i) => '<span class="tag">' + esc(i.prova) + (i.carga_kg ? ' · ' + esc(i.carga_kg) + ' kg' : '') + ((i.categorias || []).length ? ' · ' + esc(i.categorias.join(' + ')) : '') + '</span>').join('') + '</p>' : '') + '</div>' +
      '<div class="card"><h2 style="margin-top:0">Resultados no contador</h2>' + ((d.provas || []).length ? '<table class="tbl"><tr><th>Prova</th><th class="n">Repetições</th><th class="n">No count</th><th class="n">Tempo</th></tr>' + d.provas.map((p) => '<tr' + (p.mock ? ' class="kb-mock"' : '') + '><td>' + esc(p.movimento || 'Prova') + '<br><span class="sub" style="font-size:.8rem">' + (p.inicio ? new Date(p.inicio).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '') + (p.pista ? ' · plataforma ' + esc(p.pista) : '') + '</span></td><td class="n"><strong>' + (p.reps != null ? p.reps : '–') + '</strong></td><td class="n">' + (p.no_counts != null ? p.no_counts : '–') + '</td><td class="n">' + dur(p.duracao_s) + '</td></tr>').join('') + '</table>' : '<p class="sub">Seus resultados aparecem aqui depois das provas.</p>') + '</div>' +
      '<div class="card"><h2 style="margin-top:0">Frequência cardíaca</h2>' + ((d.fc || []).length ? d.fc.map((f, i) => '<button class="sess' + (f.simulado ? ' kb-mock' : '') + '" data-i="' + i + '"><span><strong>' + esc(f.movimento || 'Prova') + '</strong><br><span class="sub" style="font-size:.85rem">' + new Date(f.inicio).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' · ' + (f.score || 0) + ' repetições' + (f.simulado ? ' · SIMULADO' + '<span class="kb-mock-tag" title="Dado fictício (mock)">MOCK</span>' : '') + '</span></span><span aria-hidden="true">ver ›</span></button><div class="rel" id="r' + i + '" hidden></div>').join('') : '<p class="sub">Se você usou o sensor cardíaco numa prova, o relatório aparece aqui.</p>') + '</div>');
    const perfil = { sexo: /^m/i.test(d.sexo || '') ? 'M' : (/^f/i.test(d.sexo || '') ? 'F' : undefined), idade: d.idade, peso: d.pesagem && d.pesagem.peso_kg != null ? +d.pesagem.peso_kg : undefined, fcRepouso: d.pesagem && d.pesagem.fc_repouso != null ? +d.pesagem.fc_repouso : undefined };
    { const pc = KBMetricas.picoCampeonato ? KBMetricas.picoCampeonato(d.fc || []) : { valor: null, sessoes: [] }; if (pc.valor !== null) { perfil.picoHistorico = pc.valor; perfil.picoSessoes = pc.sessoes; } }   // referência: maior FC média de 5 s no campeonato
    const abre = (i) => {
      const el = $('r' + i);
      el.innerHTML = '<label class="chk" style="margin:0 0 6px;color:#ccc;font-size:.88rem"><input type="checkbox" class="mc"' + (mostrarC ? ' checked' : '') + '> Mostrar estimativas (calorias, FCmáx pela idade)</label>' + KBRelFC.html(d.fc[i], perfil, { estimativas: mostrarC });
      KBRelFC.liga(el); el.querySelector('.mc').onchange = (e) => { mostrarC = e.target.checked; abre(i); };
    };
    app.querySelectorAll('.sess').forEach((b) => { b.onclick = () => { const el = $('r' + b.dataset.i); el.hidden = !el.hidden; if (!el.hidden) abre(+b.dataset.i); }; });
  }

  ss.get() ? painel() : inicio();
})();
</script>
</body>
</html>
